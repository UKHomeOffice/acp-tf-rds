---
kind: pipeline
name: default
type: kubernetes

platform:
  os: linux
  arch: amd64

steps:
- name: terraform-docs-check
  pull: if-not-exists
  image: quay.io/ukhomeofficedigital/terraform-toolset:v1.1.3-2
  commands:
  - curl -sSLo /tmp/terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.20.0/terraform-docs-v0.20.0-linux-amd64.tar.gz
  - tar -xzf /tmp/terraform-docs.tar.gz -C /usr/local/bin terraform-docs
  - chmod +x /usr/local/bin/terraform-docs
  - terraform-docs .
  - |
    if ! git diff --exit-code README.md; then
      echo "ERROR: README.md is out of date. Run 'terraform-docs .' and commit the result."
      exit 1
    fi
  when:
    event:
    - pull_request
    - push

- name: validate
  pull: if-not-exists
  image: quay.io/ukhomeofficedigital/terraform-toolset:v1.1.3-2
  commands:
  - /acp/scripts/tf-validate.sh
  when:
    event:
    - pull_request
    - push

...
